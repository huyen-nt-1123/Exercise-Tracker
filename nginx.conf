server {
    listen 8080;
    root /usr/share/nginx/html;
    index index.html;

    # The app uses hash routing (#/library), so every page is just index.html.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Vite puts content-hashed files in /assets — safe to cache forever.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # Never cache the entry points of a PWA, or users get stuck on old versions.
    location = /index.html {
        add_header Cache-Control "no-cache";
    }
    location = /sw.js {
        add_header Cache-Control "no-cache";
    }

    location = /manifest.webmanifest {
        default_type application/manifest+json;
        add_header Cache-Control "no-cache";
    }
}
